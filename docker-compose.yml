services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quant
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
    ports: ["5432:5432"]
    volumes:
      - quant_pg:/var/lib/postgresql/data
      - ./infra/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./infra/postgres/002_instruments.sql:/docker-entrypoint-initdb.d/002_instruments.sql:ro
      - ./infra/postgres/003_execution_h2.sql:/docker-entrypoint-initdb.d/003_execution_h2.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant"]
      interval: 3s
      timeout: 3s
      retries: 20

  execution-cpp:
    build:
      context: .
      dockerfile: services/execution-cpp/Dockerfile
    env_file: .env
    environment:
      EXECUTION_ENGINE_PORT: 9100
    ports: ["9100:9100"]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://quant:quant@postgres:5432/quant
      EXECUTION_ENGINE: cpp
      EXECUTION_ENGINE_HOST: execution-cpp
      EXECUTION_ENGINE_PORT: 9100
      DATA_PLANE_ENABLED: ${DATA_PLANE_ENABLED:-true}
      BUS_BACKEND: ${BUS_BACKEND:-memory}
      ARCHIVE_BACKEND: ${ARCHIVE_BACKEND:-memory}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      EXECUTION_MODE: ${EXECUTION_MODE:-paper}
      ENABLE_L2_BOOKS: ${ENABLE_L2_BOOKS:-true}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      execution-cpp:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  quant_pg:
